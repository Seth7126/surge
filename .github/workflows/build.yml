name: "Build VST2 (Windows 64-bit)"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_vst2:
    name: "Windows 64-bit VST2 DLL"
    runs-on: windows-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure git line endings
        run: git config --global core.autocrlf input
        shell: bash

      - name: "Extract VST2 SDK"
        shell: pwsh
        run: |
          Expand-Archive -Path "vstsdk2.4.zip" -DestinationPath "vst2sdk" -Force

      - name: "Verify VST2 SDK structure"
        shell: bash
        run: |
          ls vst2sdk/pluginterfaces/vst2.x/

      - name: "Prepare for JUCE"
        uses: surge-synthesizer/sst-githubactions/prepare-for-juce@main
        with:
          os: ${{ runner.os }}

      - name: "Setup MSVC Developer Environment"
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: "Setup Ninja"
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: "Configure CMake"
        shell: cmd
        run: >
          cmake -S . -B ./build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSURGE_SKIP_STANDALONE=TRUE
          -DSURGE_SKIP_VST3=TRUE
          -DSURGE_BUILD_CLAP=FALSE
          -DSURGE_BUILD_TESTRUNNER=FALSE
          -Wno-dev
        env:
          VST2SDK_DIR: ${{ github.workspace }}\vst2sdk

      - name: "Build surge-xt VST2"
        shell: cmd
        run: >
          cmake --build ./build
          --config Release
          --target surge-xt_VST
          --parallel 3

      - name: "Locate output DLL"
        shell: bash
        run: |
          find ./build -name "*.dll" | grep -i "vst\|surge"

      - name: "Upload VST2 DLL artifact"
        uses: actions/upload-artifact@v4
        with:
          name: surge-xt-vst2-win64
          path: |
            build/surge-xt_artefacts/Release/VST/*.dll
          if-no-files-found: error
